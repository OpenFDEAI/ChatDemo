<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDE ChatDemo · 聊出 Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">FDE <span class="accent">ChatDemo</span> <span class="muted small">聊出 Demo</span></div>
  <div class="topbar-right">
    <span id="turn-indicator" class="pill hidden">回合运行中…</span>
    <span id="conn" class="pill pill-off">连接中…</span>
  </div>
</header>

<main class="columns">
  <!-- 左列：主操作区（拖材料+录音）/ 转写流 / Demo 描述+生成 / 回合记录 -->
  <section class="col col-left">
    <div class="card hero-card">
      <div class="hero-grid">
        <div id="dropzone" class="dropzone dropzone-hero">
          <div class="hero-icon">⇪</div>
          <div class="hero-text">拖拽截图 / API 文档到这里<br>
            <label class="filelink">或点击选择<input id="file-input" type="file" multiple hidden></label>
          </div>
        </div>
        <div class="rec-hero" id="record-card">
          <button id="btn-record" class="rec-big">● 开始录音</button>
          <div class="rec-meta">
            <span id="rec-time" class="mono rec-time">00:00</span>
            <button id="btn-pause" class="btn btn-small" disabled>⏸ 暂停</button>
          </div>
          <div class="level-track"><div id="level-bar" class="level-bar"></div></div>
        </div>
      </div>
      <ul id="inputs-list" class="inputs-list mono small"></ul>
      <div id="asr-reason" class="muted small"></div>
      <div id="asr-creds" class="asr-creds hidden">
        <input id="volc-app" type="text" placeholder="火山 APP ID" autocomplete="off">
        <input id="volc-key" type="password" placeholder="Access Token" autocomplete="off">
        <button id="btn-save-creds" class="btn btn-small">保存凭证</button>
      </div>
    </div>

    <div class="card">
      <h2>转写流 <span class="hint">高亮 = 未消费增量</span></h2>
      <div id="transcript" class="transcript mono"></div>
      <div id="partial" class="partial mono"></div>
      <div class="manual-row">
        <input id="manual-input" type="text" placeholder="手动补一句要点（逃生通道，回车写入）">
        <button id="btn-manual" class="btn">写入</button>
      </div>
    </div>

    <div class="card">
      <h2>输入 Demo 描述 <span class="hint">可选；不填就按转写增量生成</span></h2>
      <textarea id="note" rows="2" placeholder="想要什么样的 Demo，说给它听或写在这里，如「基于候选项目 X 改造」「先做大屏那页」"></textarea>
      <div class="gen-row">
        <select id="engine" title="回合驱动引擎，切换下一回合生效"></select>
        <button id="btn-turn" class="btn btn-accent gen-btn">▶ 生成 Demo</button>
      </div>
      <span id="engine-hint" class="muted small"></span>
      <div id="turn-status" class="muted small"></div>
    </div>

    <div class="card card-grow" id="journal-card">
      <h2>回合记录 <span class="hint">输入 → 输出账本（SESSION.md）· 运行中实时日志</span></h2>
      <div id="journal" class="md journal"></div>
      <div id="turn-log" class="turnlog mono"></div>
    </div>
  </section>

  <!-- 中列：DEMO_SPEC 预览 + 开源候选 -->
  <section class="col col-mid">
    <div class="card card-grow">
      <h2>DEMO_SPEC.md <span class="hint">单一事实源（投屏区）</span></h2>
      <div id="spec" class="md"></div>
    </div>
    <div class="card card-grow hidden" id="candidates-card">
      <h2>开源候选 <span class="hint">聊出新需求时，agent 搜到的可复用开源项目会列在这里，选一个基于它改</span></h2>
      <div id="candidates" class="md"></div>
    </div>
  </section>

  <!-- 右列：Demo iframe -->
  <section class="col col-right">
    <div class="card card-grow demo-card">
      <h2>
        Demo
        <button id="btn-refresh" class="btn btn-small">↻ 手动刷新</button>
        <a id="demo-url" class="muted mono small" target="_blank" rel="noopener" title="新窗口打开完整页面（投屏用）"></a>
      </h2>
      <iframe id="demo-frame" title="demo"></iframe>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
